<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>kimtim — Login</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      width:420px;height:600px;overflow:hidden;
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
      background:linear-gradient(135deg,#0f0c29 0%,#302b63 50%,#24243e 100%);
      display:flex;align-items:center;justify-content:center;
    }
    .wrap{
      background:rgba(255,255,255,.07);
      border:1px solid rgba(255,255,255,.12);
      border-radius:22px;padding:36px 32px 32px;
      width:100%;max-width:360px;
      backdrop-filter:blur(20px);
      box-shadow:0 20px 60px rgba(0,0,0,.5);
    }
    .logo{display:block;width:68px;height:68px;border-radius:50%;margin:0 auto 20px}
    h1{text-align:center;color:#f0f6ff;font-size:22px;font-weight:800;margin-bottom:4px}
    .sub{text-align:center;color:rgba(240,246,255,.45);font-size:12px;margin-bottom:28px}

    /* ── Telegram login button ── */
    .tg-btn{
      display:flex;align-items:center;justify-content:center;gap:10px;
      width:100%;padding:13px 18px;
      background:linear-gradient(135deg,#2AABEE,#229ED9);
      border:none;border-radius:12px;cursor:pointer;
      color:#fff;font-size:14px;font-weight:700;
      transition:transform .15s,opacity .15s;
      margin-bottom:18px;
    }
    .tg-btn:hover{transform:translateY(-2px);opacity:.92}
    .tg-btn:active{transform:translateY(0)}
    .tg-btn:disabled{opacity:.55;cursor:default;transform:none}
    .tg-btn svg{width:22px;height:22px;flex-shrink:0}

    /* ── divider ── */
    .divider{
      display:flex;align-items:center;gap:10px;
      color:rgba(240,246,255,.3);font-size:11px;
      margin-bottom:16px;
    }
    .divider::before,.divider::after{
      content:'';flex:1;height:1px;
      background:rgba(255,255,255,.08);
    }

    /* ── token input ── */
    .form-group{margin-bottom:14px}
    label{display:block;color:rgba(240,246,255,.65);font-size:11px;font-weight:600;
          text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px}
    input{
      width:100%;padding:11px 14px;
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.12);
      border-radius:10px;color:#f0f6ff;font-size:13px;
    }
    input::placeholder{color:rgba(240,246,255,.28)}
    input:focus{outline:none;border-color:#5ebba0;box-shadow:0 0 0 3px rgba(94,187,172,.12)}

    .btn-submit{
      width:100%;padding:12px;
      background:linear-gradient(135deg,#5ebba0,#3d9e84);
      border:none;border-radius:10px;cursor:pointer;
      color:#fff;font-size:13px;font-weight:700;
      transition:transform .15s,opacity .15s;
    }
    .btn-submit:hover{transform:translateY(-1px);opacity:.9}
    .btn-submit:disabled{opacity:.5;cursor:default;transform:none}

    /* ── status messages ── */
    .msg{
      margin-top:16px;padding:11px 14px;border-radius:10px;
      font-size:12px;line-height:1.55;display:none;text-align:center;
    }
    .msg.show{display:block}
    .msg.success{background:rgba(94,187,172,.12);border:1px solid rgba(94,187,172,.25);color:#7ef4bf}
    .msg.error  {background:rgba(224,112,112,.1); border:1px solid rgba(224,112,112,.2); color:#ff9a9a}
    .msg.info   {background:rgba(102,126,234,.1); border:1px solid rgba(102,126,234,.2); color:#a5b4fc}

    /* ── spinner ── */
    .spin{
      display:inline-block;width:14px;height:14px;vertical-align:middle;
      border:2px solid rgba(255,255,255,.2);border-top-color:currentColor;
      border-radius:50%;animation:sp .65s linear infinite;margin-right:6px;
    }
    @keyframes sp{to{transform:rotate(360deg)}}

    .help{
      margin-top:18px;padding-top:16px;border-top:1px solid rgba(255,255,255,.07);
      font-size:11px;color:rgba(240,246,255,.4);line-height:1.6;text-align:center;
    }
    .help a{color:#5ebba0;text-decoration:none}
    .help a:hover{text-decoration:underline}
  </style>
</head>
<body>
<div class="wrap">
  <img class="logo" src="icons/icon128.png" alt="kimtim">
  <h1>kimtim</h1>
  <p class="sub">Stripe Auto Hitter — v2.0</p>

  <!-- ── Primary: Telegram OAuth login ── -->
  <button class="tg-btn" id="tgLoginBtn">
    <svg viewBox="0 0 24 24" fill="currentColor">
      <path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.479.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/>
    </svg>
    Login with Telegram
  </button>

  <div class="divider">or paste token</div>

  <!-- ── Fallback: manual token paste ── -->
  <div class="form-group">
    <label for="tokenInput">Session Token</label>
    <input type="text" id="tokenInput"
           placeholder="Paste token from /token command" spellcheck="false" autocomplete="off">
  </div>
  <button class="btn-submit" id="tokenSubmit">Activate Token</button>

  <div class="msg" id="msg"></div>

  <div class="help">
    Click <strong>Login with Telegram</strong> → approve in the bot<br>
    or send <code>/token</code> to the bot and paste it above.<br><br>
    <a href="https://t.me/kimtim" target="_blank">Support: @kimtim</a>
  </div>
</div>

<script src="script/login.js"></script>
</body>
</html>
