<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#060b14">
<title>kimtim Admin</title>
<style>
:root{
  --bg:#060b14;--surface:#0d1420;--card:#121a27;--border:rgba(255,255,255,.08);
  --accent:#5ebba0;--accent-dim:rgba(94,187,160,.12);--accent-glow:rgba(94,187,160,.2);
  --red:#e07070;--red-dim:rgba(224,112,112,.12);
  --yellow:#efb84f;--yellow-dim:rgba(239,184,79,.1);
  --green:#5ebba0;--green-dim:rgba(94,187,160,.1);
  --text:#e8f0fe;--text2:rgba(232,240,254,.55);--text3:rgba(232,240,254,.3);
  --nav-h:64px;--header-h:54px;--radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
input,button,textarea{font-family:inherit}

/* ── SCROLLBARS ── */
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* ═══════════════════════════════════════════
   LOGIN SCREEN
═══════════════════════════════════════════ */
#login{
  position:fixed;inset:0;z-index:99;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(160deg,#060b14 0%,#0c1e30 100%);
  padding:24px;
}
.login-card{
  width:100%;max-width:360px;
  background:var(--card);border:1px solid var(--border);border-radius:22px;
  padding:36px 28px 32px;
  box-shadow:0 20px 60px rgba(0,0,0,.5);
}
.login-logo{
  width:60px;height:60px;border-radius:16px;margin:0 auto 18px;display:block;
  background:var(--accent-dim);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
}
.login-logo svg{width:32px;height:32px;stroke:var(--accent)}
.login-title{text-align:center;font-size:22px;font-weight:800;color:var(--text);margin-bottom:4px}
.login-sub{text-align:center;font-size:12px;color:var(--text3);margin-bottom:28px}
.field-label{font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.7px;margin-bottom:6px;display:block}
.field-input{
  width:100%;padding:13px 16px;
  background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:12px;
  color:var(--text);font-size:15px;letter-spacing:2px;outline:none;
  transition:border-color .2s,box-shadow .2s;
}
.field-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
.field-input::placeholder{letter-spacing:0;color:var(--text3)}
.login-btn{
  width:100%;margin-top:20px;padding:14px;
  background:linear-gradient(135deg,var(--accent),#3d9e84);
  border:none;border-radius:12px;color:#fff;font-size:15px;font-weight:700;cursor:pointer;
  transition:opacity .15s,transform .15s;
}
.login-btn:active{transform:scale(.97);opacity:.85}
.login-btn:disabled{opacity:.5;cursor:default}
.login-err{
  margin-top:14px;padding:10px 14px;border-radius:10px;
  background:var(--red-dim);border:1px solid rgba(224,112,112,.2);
  color:var(--red);font-size:13px;text-align:center;display:none;
}
.login-err.show{display:block}

/* ═══════════════════════════════════════════
   APP SHELL
═══════════════════════════════════════════ */
#app{display:none;flex-direction:column;height:100%}
#app.visible{display:flex}

/* ── HEADER ── */
.header{
  height:var(--header-h);flex-shrink:0;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;background:var(--surface);
  border-bottom:1px solid var(--border);
  position:relative;z-index:10;
}
.header-title{font-size:17px;font-weight:800;color:var(--text);display:flex;align-items:center;gap:8px}
.header-title span{font-size:10px;font-weight:600;color:var(--accent);background:var(--accent-dim);padding:2px 8px;border-radius:99px;letter-spacing:.5px}
.header-actions{display:flex;align-items:center;gap:8px}
.icon-btn{
  width:36px;height:36px;border-radius:10px;border:1px solid var(--border);
  background:rgba(255,255,255,.03);color:var(--text2);cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:background .15s,color .15s;
}
.icon-btn:active{background:rgba(255,255,255,.08);color:var(--text)}
.icon-btn svg{width:17px;height:17px}
.spinning{animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── CONTENT ── */
.content{flex:1;overflow:hidden;position:relative}
.tab-panel{
  position:absolute;inset:0;overflow-y:auto;padding:14px 12px;padding-bottom:16px;
  display:none;
}
.tab-panel.active{display:block}

/* ── BOTTOM NAV ── */
.bottom-nav{
  height:var(--nav-h);flex-shrink:0;
  display:flex;background:var(--surface);border-top:1px solid var(--border);
}
.nav-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:4px;border:none;background:none;color:var(--text3);cursor:pointer;
  transition:color .15s;font-size:10px;font-weight:600;letter-spacing:.3px;
  padding:0;
}
.nav-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav-btn.active{color:var(--accent)}
.nav-btn.active svg{stroke:var(--accent)}

/* ═══════════════════════════════════════════
   STAT CARDS
═══════════════════════════════════════════ */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat-card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px 14px;
}
.stat-card-val{font-size:26px;font-weight:800;color:var(--text);line-height:1}
.stat-card-label{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;margin-top:5px}
.stat-card.accent .stat-card-val{color:var(--accent)}
.stat-card.red    .stat-card-val{color:var(--red)}
.stat-card.yellow .stat-card-val{color:var(--yellow)}

/* ── Section header ── */
.section-head{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:10px;margin-top:4px;
}
.section-title{font-size:12px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.7px}
.section-count{font-size:11px;color:var(--text3);font-weight:600}

/* ═══════════════════════════════════════════
   SEARCH + FILTER
═══════════════════════════════════════════ */
.search-wrap{position:relative;margin-bottom:10px}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text3);pointer-events:none}
.search-icon svg{width:16px;height:16px}
.search-input{
  width:100%;padding:11px 14px 11px 38px;
  background:var(--card);border:1px solid var(--border);border-radius:12px;
  color:var(--text);font-size:14px;outline:none;
  transition:border-color .2s,box-shadow .2s;
}
.search-input:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-glow)}
.search-input::placeholder{color:var(--text3)}

.filter-chips{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;padding-bottom:2px}
.filter-chips::-webkit-scrollbar{display:none}
.chip{
  flex-shrink:0;padding:6px 14px;border-radius:99px;border:1px solid var(--border);
  background:transparent;color:var(--text2);font-size:12px;font-weight:600;cursor:pointer;
  transition:all .15s;white-space:nowrap;
}
.chip.active{background:var(--accent-dim);border-color:rgba(94,187,160,.3);color:var(--accent)}

/* ═══════════════════════════════════════════
   USER CARDS
═══════════════════════════════════════════ */
.user-card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  margin-bottom:8px;overflow:hidden;
}
.user-card-top{display:flex;align-items:center;gap:12px;padding:14px 14px 12px}
.user-avatar{
  width:46px;height:46px;border-radius:13px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;font-weight:800;color:#fff;
  background:linear-gradient(135deg,#5ebba0,#3d9e84);
}
.user-avatar img{width:100%;height:100%;border-radius:13px;object-fit:cover}
.user-info{flex:1;min-width:0}
.user-name{font-size:15px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-sub{font-size:11px;color:var(--text3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status-badge{
  flex-shrink:0;font-size:10px;font-weight:700;padding:3px 10px;border-radius:99px;
  text-transform:uppercase;letter-spacing:.5px;
}
.status-badge.active   {background:var(--green-dim,rgba(94,187,160,.1));color:var(--green);border:1px solid rgba(94,187,160,.2)}
.status-badge.suspended{background:var(--yellow-dim);color:var(--yellow);border:1px solid rgba(239,184,79,.2)}
.status-badge.banned   {background:var(--red-dim);color:var(--red);border:1px solid rgba(224,112,112,.2)}

.user-stats{display:flex;gap:12px;padding:0 14px 12px}
.user-stat{font-size:11px;color:var(--text3)}
.user-stat strong{color:var(--text);font-weight:700}

.user-actions{display:flex;border-top:1px solid var(--border)}
.action-btn{
  flex:1;padding:11px 4px;border:none;background:none;cursor:pointer;
  font-size:12px;font-weight:700;transition:background .15s;
  display:flex;align-items:center;justify-content:center;gap:5px;
}
.action-btn+.action-btn{border-left:1px solid var(--border)}
.action-btn:active{filter:brightness(1.3)}
.action-btn.ban    {color:var(--red)}
.action-btn.suspend{color:var(--yellow)}
.action-btn.activate{color:var(--accent)}
.action-btn.view   {color:var(--text2)}
.action-btn svg{width:13px;height:13px}

/* ═══════════════════════════════════════════
   HIT CARDS
═══════════════════════════════════════════ */
.hit-card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px;margin-bottom:8px;
}
.hit-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.hit-site{font-size:14px;font-weight:700;color:var(--accent)}
.hit-amount{font-size:13px;font-weight:700;color:var(--text);background:var(--accent-dim);padding:2px 10px;border-radius:8px}
.hit-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px}
.hit-label{font-size:11px;color:var(--text3)}
.hit-val{font-size:12px;font-weight:600;color:var(--text);font-family:monospace}
.hit-footer{margin-top:10px;padding-top:9px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.hit-user{font-size:11px;color:var(--text2);font-weight:600}
.hit-time{font-size:10px;color:var(--text3)}

/* ═══════════════════════════════════════════
   PROXY CARDS
═══════════════════════════════════════════ */
.proxy-card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px;margin-bottom:8px;display:flex;align-items:center;gap:12px;
}
.proxy-icon{
  width:40px;height:40px;border-radius:11px;flex-shrink:0;
  background:var(--accent-dim);border:1px solid rgba(94,187,160,.15);
  display:flex;align-items:center;justify-content:center;color:var(--accent);
}
.proxy-icon svg{width:18px;height:18px}
.proxy-info{flex:1;min-width:0}
.proxy-host{font-size:14px;font-weight:700;color:var(--text);font-family:monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.proxy-meta{font-size:11px;color:var(--text3);margin-top:3px}
.proxy-auth{font-size:10px;font-weight:700;padding:2px 8px;border-radius:6px;flex-shrink:0;
  background:var(--accent-dim);color:var(--accent);border:1px solid rgba(94,187,160,.15)}

/* ═══════════════════════════════════════════
   TOAST / FEEDBACK
═══════════════════════════════════════════ */
#toast{
  position:fixed;bottom:calc(var(--nav-h) + 12px);left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:11px 20px;font-size:13px;font-weight:600;color:var(--text);
  box-shadow:0 8px 30px rgba(0,0,0,.4);
  pointer-events:none;opacity:0;transition:opacity .2s,transform .2s;white-space:nowrap;
  z-index:50;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.success{color:var(--green)}
#toast.error{color:var(--red)}

/* ── Empty / loading states ── */
.empty{text-align:center;padding:40px 20px;color:var(--text3);font-size:13px}
.empty svg{width:40px;height:40px;stroke:var(--text3);opacity:.3;margin:0 auto 12px;display:block}
.loader{display:flex;justify-content:center;padding:30px}
.loader-ring{width:26px;height:26px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}

/* ── Load more ── */
.load-more-btn{
  width:100%;margin-top:10px;padding:13px;
  background:var(--card);border:1px solid var(--border);border-radius:12px;
  color:var(--text2);font-size:13px;font-weight:600;cursor:pointer;
  transition:background .15s,color .15s;
}
.load-more-btn:active{background:rgba(255,255,255,.06);color:var(--text)}

/* ── Confirm overlay ── */
#confirm{
  position:fixed;inset:0;z-index:80;display:none;
  align-items:flex-end;justify-content:center;padding:12px;
  background:rgba(6,11,20,.7);backdrop-filter:blur(8px);
}
#confirm.show{display:flex}
.confirm-sheet{
  width:100%;max-width:400px;background:var(--card);border:1px solid var(--border);
  border-radius:22px;padding:24px 20px 20px;
}
.confirm-title{font-size:17px;font-weight:800;color:var(--text);margin-bottom:6px}
.confirm-msg{font-size:13px;color:var(--text2);margin-bottom:20px;line-height:1.5}
.confirm-btns{display:flex;gap:10px}
.confirm-btn{flex:1;padding:13px;border-radius:12px;border:none;font-size:14px;font-weight:700;cursor:pointer;transition:opacity .15s}
.confirm-btn:active{opacity:.75}
.confirm-btn.cancel{background:rgba(255,255,255,.06);color:var(--text2)}
.confirm-btn.danger{background:linear-gradient(135deg,#c43a3a,#e05555);color:#fff}
.confirm-btn.warn  {background:linear-gradient(135deg,#c88c1a,#efb84f);color:#fff}
.confirm-btn.ok    {background:linear-gradient(135deg,var(--accent),#3d9e84);color:#fff}
</style>
</head>
<body>

<!-- ══════════════════════════════════════════
     LOGIN SCREEN
══════════════════════════════════════════ -->
<div id="login">
  <div class="login-card">
    <div class="login-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
    </div>
    <div class="login-title">kimtim Admin</div>
    <div class="login-sub">Enter admin password to continue</div>
    <label class="field-label" for="pwInput">Password</label>
    <input class="field-input" id="pwInput" type="password" placeholder="••••••••" autocomplete="current-password">
    <button class="login-btn" id="loginBtn">Login</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<!-- ══════════════════════════════════════════
     APP SHELL
══════════════════════════════════════════ -->
<div id="app">
  <!-- Header -->
  <div class="header">
    <div class="header-title">
      kimtim <span>ADMIN</span>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="refreshBtn" title="Refresh">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/>
          <path d="M3.51 9a9 9 0 0 1 14.13-3.36L23 10M20.49 15a9 9 0 0 1-14.13 3.36L1 14"/>
        </svg>
      </button>
      <button class="icon-btn" id="logoutBtn" title="Logout">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Content -->
  <div class="content">

    <!-- ── STATS TAB ── -->
    <div class="tab-panel active" id="panel-stats">
      <div class="stats-grid">
        <div class="stat-card accent"><div class="stat-card-val" id="sUsers">--</div><div class="stat-card-label">Total Users</div></div>
        <div class="stat-card"><div class="stat-card-val" id="sHits">--</div><div class="stat-card-label">Total Hits</div></div>
        <div class="stat-card accent"><div class="stat-card-val" id="sToday">--</div><div class="stat-card-label">Hits Today</div></div>
        <div class="stat-card"><div class="stat-card-val" id="sProxies">--</div><div class="stat-card-label">Active Proxies</div></div>
      </div>
      <div class="stats-grid" style="margin-top:-4px">
        <div class="stat-card yellow"><div class="stat-card-val" id="sSuspended">--</div><div class="stat-card-label">Suspended</div></div>
        <div class="stat-card red"><div class="stat-card-val" id="sBanned">--</div><div class="stat-card-label">Banned</div></div>
      </div>

      <div class="section-head" style="margin-top:8px">
        <div class="section-title">Recent Hits</div>
      </div>
      <div id="statsHits"></div>
    </div>

    <!-- ── USERS TAB ── -->
    <div class="tab-panel" id="panel-users">
      <div class="search-wrap">
        <span class="search-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
        <input class="search-input" id="userSearch" placeholder="Search name, username, Telegram ID…" autocomplete="off">
      </div>
      <div class="filter-chips">
        <button class="chip active" data-status="">All</button>
        <button class="chip" data-status="active">Active</button>
        <button class="chip" data-status="suspended">Suspended</button>
        <button class="chip" data-status="banned">Banned</button>
      </div>
      <div class="section-head">
        <div class="section-title">Users</div>
        <div class="section-count" id="userCount"></div>
      </div>
      <div id="userList"></div>
      <button class="load-more-btn" id="usersMoreBtn" style="display:none">Load more…</button>
    </div>

    <!-- ── HITS TAB ── -->
    <div class="tab-panel" id="panel-hits">
      <div class="section-head">
        <div class="section-title">All Hits</div>
        <div class="section-count" id="hitCount"></div>
      </div>
      <div id="hitList"></div>
      <button class="load-more-btn" id="hitsMoreBtn" style="display:none">Load more…</button>
    </div>

    <!-- ── PROXIES TAB ── -->
    <div class="tab-panel" id="panel-proxies">
      <div class="section-head">
        <div class="section-title">Saved Proxies</div>
        <div class="section-count" id="proxyCount"></div>
      </div>
      <div id="proxyList"></div>
      <button class="load-more-btn" id="proxiesMoreBtn" style="display:none">Load more…</button>
    </div>

  </div><!-- /content -->

  <!-- Bottom Nav -->
  <div class="bottom-nav">
    <button class="nav-btn active" data-tab="stats">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      Stats
    </button>
    <button class="nav-btn" data-tab="users">
      <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      Users
    </button>
    <button class="nav-btn" data-tab="hits">
      <svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      Hits
    </button>
    <button class="nav-btn" data-tab="proxies">
      <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      Proxies
    </button>
  </div>
</div>

<!-- Toast -->
<div id="toast"></div>

<!-- Confirm sheet -->
<div id="confirm">
  <div class="confirm-sheet">
    <div class="confirm-title" id="confirmTitle">Are you sure?</div>
    <div class="confirm-msg"   id="confirmMsg"></div>
    <div class="confirm-btns">
      <button class="confirm-btn cancel" id="confirmCancel">Cancel</button>
      <button class="confirm-btn" id="confirmOk">Confirm</button>
    </div>
  </div>
</div>

<script>
'use strict';
// ═══════════════════════════════════════════
//  CONFIG — change if your Vercel URL differs
// ═══════════════════════════════════════════
const API = '';  // empty = same origin (Vercel serves both admin.html and /api/)

// ═══════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════
const S = {
  token:       sessionStorage.getItem('kim_admin_token') || '',
  currentTab:  'stats',
  userStatus:  '',
  userSearch:  '',
  userOffset:  0,
  userTotal:   0,
  hitOffset:   0,
  hitTotal:    0,
  proxyOffset: 0,
  proxyTotal:  0,
  refreshing:  false
};

// ═══════════════════════════════════════════
//  API LAYER
// ═══════════════════════════════════════════
async function apiFetch(method, path, body) {
  const headers = { 'Content-Type': 'application/json' };
  if (S.token) headers['Authorization'] = 'Bearer ' + S.token;
  const opts = { method, headers };
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch(API + path, opts);
  const d = await r.json().catch(() => ({ success: false, error: 'Invalid JSON' }));
  if (r.status === 401) { logout(); return { success: false, error: 'Session expired' }; }
  return d;
}

const api = {
  login:      pw => apiFetch('POST', '/api/admin/login',       { password: pw }),
  stats:      ()  => apiFetch('GET',  '/api/admin/stats'),
  users:      (s, st, off) => apiFetch('GET', `/api/admin/users?search=${encodeURIComponent(s)}&status=${st}&limit=30&offset=${off}`),
  userAction: (id, act)  => apiFetch('POST', '/api/admin/user-action', { user_id: id, action: act }),
  hits:       (off)      => apiFetch('GET', `/api/admin/hits?limit=30&offset=${off}`),
  proxies:    (off)      => apiFetch('GET', `/api/admin/proxies?limit=30&offset=${off}`)
};

// ═══════════════════════════════════════════
//  DOM HELPERS
// ═══════════════════════════════════════════
const $  = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

let toastTimer;
function toast(msg, type = '') {
  const el = $('toast');
  el.textContent = msg;
  el.className   = 'show ' + type;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = ''; }, 2600);
}

function loader() {
  return '<div class="loader"><div class="loader-ring"></div></div>';
}
function emptyState(msg) {
  return `<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><line x1="8" y1="12" x2="16" y2="12"/></svg>${esc(msg)}</div>`;
}

let confirmCb = null;
function showConfirm(title, msg, btnClass, btnLabel, cb) {
  $('confirmTitle').textContent = title;
  $('confirmMsg').textContent   = msg;
  const ok = $('confirmOk');
  ok.className  = 'confirm-btn ' + btnClass;
  ok.textContent = btnLabel;
  $('confirm').classList.add('show');
  confirmCb = cb;
}
$('confirmCancel').onclick = () => { $('confirm').classList.remove('show'); confirmCb = null; };
$('confirmOk').onclick     = () => { $('confirm').classList.remove('show'); if (confirmCb) confirmCb(); confirmCb = null; };

// ═══════════════════════════════════════════
//  AUTH
// ═══════════════════════════════════════════
function login() {
  const pw  = $('pwInput').value.trim();
  const err = $('loginErr');
  const btn = $('loginBtn');
  if (!pw) { err.textContent = 'Enter the admin password.'; err.classList.add('show'); return; }
  btn.disabled  = true;
  btn.textContent = 'Logging in…';
  err.classList.remove('show');

  api.login(pw).then(d => {
    if (d.success && d.token) {
      S.token = d.token;
      sessionStorage.setItem('kim_admin_token', d.token);
      $('login').style.display = 'none';
      $('app').classList.add('visible');
      loadCurrentTab();
    } else {
      err.textContent = d.error || 'Incorrect password.';
      err.classList.add('show');
      $('pwInput').value = '';
      $('pwInput').focus();
    }
  }).catch(() => {
    err.textContent = 'Network error — check your connection.';
    err.classList.add('show');
  }).finally(() => {
    btn.disabled    = false;
    btn.textContent = 'Login';
  });
}

function logout() {
  S.token = '';
  sessionStorage.removeItem('kim_admin_token');
  $('app').classList.remove('visible');
  $('login').style.display = '';
  $('pwInput').value = '';
  $('loginErr').classList.remove('show');
}

$('loginBtn').onclick  = login;
$('pwInput').onkeydown = e => { if (e.key === 'Enter') login(); };
$('logoutBtn').onclick = () => showConfirm('Logout', 'End your admin session?', 'danger', 'Logout', logout);

// ═══════════════════════════════════════════
//  TAB NAVIGATION
// ═══════════════════════════════════════════
const TABS = ['stats','users','hits','proxies'];

function switchTab(tab) {
  if (!TABS.includes(tab)) return;
  S.currentTab = tab;

  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + tab));

  loadCurrentTab();
}

document.querySelectorAll('.nav-btn').forEach(b => {
  b.onclick = () => switchTab(b.dataset.tab);
});

$('refreshBtn').onclick = () => {
  if (S.refreshing) return;
  S.refreshing = true;
  const icon = $('refreshBtn').querySelector('svg');
  icon.classList.add('spinning');
  const p = loadCurrentTab();
  (p || Promise.resolve()).finally(() => {
    S.refreshing = false;
    icon.classList.remove('spinning');
  });
};

function loadCurrentTab() {
  switch (S.currentTab) {
    case 'stats':   return loadStats();
    case 'users':   return loadUsers(true);
    case 'hits':    return loadHits(true);
    case 'proxies': return loadProxies(true);
  }
}

// ═══════════════════════════════════════════
//  STATS TAB
// ═══════════════════════════════════════════
function loadStats() {
  return Promise.all([ api.stats(), api.hits(0) ]).then(([statsD, hitsD]) => {
    if (statsD.success && statsD.stats) {
      const s = statsD.stats;
      $('sUsers').textContent    = fmt(s.total_users);
      $('sHits').textContent     = fmt(s.total_hits);
      $('sToday').textContent    = fmt(s.hits_today);
      $('sProxies').textContent  = fmt(s.total_proxies);
      $('sSuspended').textContent= fmt(s.suspended_users);
      $('sBanned').textContent   = fmt(s.banned_users);
    }
    if (hitsD.success) {
      $('statsHits').innerHTML = hitsD.hits.length
        ? hitsD.hits.slice(0, 6).map(renderHitCard).join('')
        : emptyState('No hits yet');
    }
  });
}

function fmt(n) { return Number(n).toLocaleString(); }

// ═══════════════════════════════════════════
//  USERS TAB
// ═══════════════════════════════════════════
let userSearchTimer;

$('userSearch').oninput = () => {
  clearTimeout(userSearchTimer);
  userSearchTimer = setTimeout(() => {
    S.userSearch = $('userSearch').value.trim();
    loadUsers(true);
  }, 380);
};

document.querySelectorAll('.filter-chips .chip').forEach(c => {
  c.onclick = () => {
    document.querySelectorAll('.filter-chips .chip').forEach(x => x.classList.remove('active'));
    c.classList.add('active');
    S.userStatus = c.dataset.status;
    loadUsers(true);
  };
});

function loadUsers(reset) {
  if (reset) { S.userOffset = 0; $('userList').innerHTML = loader(); }
  return api.users(S.userSearch, S.userStatus, S.userOffset).then(d => {
    if (!d.success) { $('userList').innerHTML = emptyState('Failed to load users'); return; }
    S.userTotal = d.total;
    $('userCount').textContent = fmt(d.total) + ' users';

    const html = d.users.map(renderUserCard).join('');
    if (reset) {
      $('userList').innerHTML = html || emptyState('No users found');
    } else {
      $('userList').insertAdjacentHTML('beforeend', html);
    }
    S.userOffset += d.users.length;
    $('usersMoreBtn').style.display = S.userOffset < S.userTotal ? '' : 'none';
  });
}

$('usersMoreBtn').onclick = () => loadUsers(false);

function renderUserCard(u) {
  const name    = esc(u.first_name || u.username || 'Unknown');
  const sub     = [u.username ? '@' + u.username : '', 'TG: ' + u.telegram_id].filter(Boolean).join(' · ');
  const initial = (u.first_name || u.username || '?').charAt(0).toUpperCase();
  const pfp     = u.pfp_url ? `<img src="${esc(u.pfp_url)}" alt="">` : initial;
  const since   = timeAgo(u.created_at);

  const isBanned    = u.status === 'banned';
  const isSuspended = u.status === 'suspended';
  const isActive    = u.status === 'active';

  // Action buttons
  let actions = '';
  if (!isBanned)    actions += `<button class="action-btn ban"     onclick="doUserAction('${u.id}','ban',     '${name}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg>Ban</button>`;
  if (!isSuspended) actions += `<button class="action-btn suspend"  onclick="doUserAction('${u.id}','suspend','${name}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>Suspend</button>`;
  if (!isActive)    actions += `<button class="action-btn activate" onclick="doUserAction('${u.id}','activate','${name}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>Activate</button>`;

  return `
<div class="user-card" id="ucard-${u.id}">
  <div class="user-card-top">
    <div class="user-avatar">${pfp}</div>
    <div class="user-info">
      <div class="user-name">${name}</div>
      <div class="user-sub">${esc(sub)}</div>
    </div>
    <span class="status-badge ${esc(u.status)}">${esc(u.status)}</span>
  </div>
  <div class="user-stats">
    <div class="user-stat"><strong>${fmt(u.hits || 0)}</strong> hits</div>
    <div class="user-stat"><strong>${fmt(u.attempts || 0)}</strong> attempts</div>
    <div class="user-stat">Joined ${esc(since)}</div>
  </div>
  <div class="user-actions">${actions}</div>
</div>`;
}

function doUserAction(userId, action, nameEsc) {
  const labels  = { ban: ['Ban User', 'danger', 'Ban'], suspend: ['Suspend User', 'warn', 'Suspend'], activate: ['Activate User', 'ok', 'Activate'] };
  const [title, cls, btn] = labels[action];
  const msgs    = { ban: `Ban ${nameEsc}? All their sessions will be revoked.`, suspend: `Suspend ${nameEsc}? They won't be able to use the extension until activated.`, activate: `Activate ${nameEsc}? They'll be able to log in again.` };

  showConfirm(title, msgs[action], cls, btn, async () => {
    const d = await api.userAction(userId, action);
    if (d.success) {
      toast(d.message || 'Done', 'success');
      loadUsers(true);
    } else {
      toast(d.error || 'Action failed', 'error');
    }
  });
}

// ═══════════════════════════════════════════
//  HITS TAB
// ═══════════════════════════════════════════
function loadHits(reset) {
  if (reset) { S.hitOffset = 0; $('hitList').innerHTML = loader(); }
  return api.hits(S.hitOffset).then(d => {
    if (!d.success) { $('hitList').innerHTML = emptyState('Failed to load hits'); return; }
    S.hitTotal = d.total;
    $('hitCount').textContent = fmt(d.total) + ' total';

    const html = d.hits.map(renderHitCard).join('');
    if (reset) {
      $('hitList').innerHTML = html || emptyState('No hits recorded yet');
    } else {
      $('hitList').insertAdjacentHTML('beforeend', html);
    }
    S.hitOffset += d.hits.length;
    $('hitsMoreBtn').style.display = S.hitOffset < S.hitTotal ? '' : 'none';
  });
}

$('hitsMoreBtn').onclick = () => loadHits(false);

function renderHitCard(h) {
  const cur = esc((h.currency || 'USD').toUpperCase());
  return `
<div class="hit-card">
  <div class="hit-header">
    <div class="hit-site">${esc(h.site || 'N/A')}</div>
    <div class="hit-amount">${esc(h.amount || '0')} ${cur}</div>
  </div>
  <div class="hit-row"><span class="hit-label">Card</span><span class="hit-val">${esc(h.card_masked)}</span></div>
  <div class="hit-row"><span class="hit-label">BIN</span><span class="hit-val">${esc(h.bin)}</span></div>
  <div class="hit-row"><span class="hit-label">Attempts</span><span class="hit-val">${esc(h.attempt_count)}</span></div>
  <div class="hit-footer">
    <div class="hit-user">👤 ${esc(h.user_name)}</div>
    <div class="hit-time">${esc(timeAgo(h.created_at))}</div>
  </div>
</div>`;
}

// ═══════════════════════════════════════════
//  PROXIES TAB
// ═══════════════════════════════════════════
function loadProxies(reset) {
  if (reset) { S.proxyOffset = 0; $('proxyList').innerHTML = loader(); }
  return api.proxies(S.proxyOffset).then(d => {
    if (!d.success) { $('proxyList').innerHTML = emptyState('Failed to load proxies'); return; }
    S.proxyTotal = d.total;
    $('proxyCount').textContent = fmt(d.total) + ' saved';

    const html = d.proxies.map(renderProxyCard).join('');
    if (reset) {
      $('proxyList').innerHTML = html || emptyState('No proxies saved yet');
    } else {
      $('proxyList').insertAdjacentHTML('beforeend', html);
    }
    S.proxyOffset += d.proxies.length;
    $('proxiesMoreBtn').style.display = S.proxyOffset < S.proxyTotal ? '' : 'none';
  });
}

$('proxiesMoreBtn').onclick = () => loadProxies(false);

function renderProxyCard(p) {
  return `
<div class="proxy-card">
  <div class="proxy-icon">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
    </svg>
  </div>
  <div class="proxy-info">
    <div class="proxy-host">${esc(p.display)}${p.label ? ' <small style="color:var(--text3);font-size:10px;">'+esc(p.label)+'</small>' : ''}</div>
    <div class="proxy-meta">👤 ${esc(p.user_name)} · ${esc(timeAgo(p.created_at))}</div>
  </div>
  ${p.has_auth ? '<span class="proxy-auth">AUTH</span>' : ''}
</div>`;
}

// ═══════════════════════════════════════════
//  UTILS
// ═══════════════════════════════════════════
function timeAgo(ts) {
  if (!ts) return '--';
  const diff = Math.floor((Date.now() - new Date(ts)) / 1000);
  if (diff < 60)   return diff + 's ago';
  if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
  if (diff < 86400)return Math.floor(diff / 3600) + 'h ago';
  return Math.floor(diff / 86400) + 'd ago';
}

// ═══════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════
(function init() {
  if (S.token) {
    // Already have a token — show app, load data
    $('login').style.display = 'none';
    $('app').classList.add('visible');
    loadCurrentTab();
  }
  // else login screen is visible by default
})();
</script>
</body>
</html>
